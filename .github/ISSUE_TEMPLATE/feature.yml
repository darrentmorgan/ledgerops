name: Feature request
description: Suggest an improvement to LedgerOps CLI using synthetic examples.
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use [private vulnerability reporting](https://github.com/darrentmorgan/ledgerops/security/advisories/new).
        Redact tenant IDs, access and refresh tokens, organisation names, client IDs, and other sensitive data from all text, logs, screenshots, and attachments.
        Use synthetic examples; do not include real organisation data.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction check
      options:
        - label: I have removed tenant IDs, tokens, organisation names, and other sensitive data from this report and its attachments.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the operator problem without real organisation details.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Describe the command or output you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing commands or other approaches you considered.
    validations:
      required: true
