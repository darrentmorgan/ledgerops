name: Bug report
description: Report a reproducible problem using redacted, synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use [private vulnerability reporting](https://github.com/darrentmorgan/ledgerops/security/advisories/new).
        Redact tenant IDs, access and refresh tokens, organisation names, client IDs, and other sensitive data from all text, logs, screenshots, and attachments.
        Use synthetic examples; do not include real organisation data.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction check
      options:
        - label: I have removed tenant IDs, tokens, organisation names, and other sensitive data from this report and its attachments.
          required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: CLI version or commit, Node version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the command and minimal offline, synthetic input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened? Include only redacted output.
    validations:
      required: true
