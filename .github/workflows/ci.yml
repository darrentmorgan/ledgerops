name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  checks:
    name: CI / Node 24 / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-latest' && vars.CI_RUNNER_JSON || toJSON(matrix.os)) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run inventory:check
      - run: npm audit --omit=dev
      - run: npm run pack:check
      - run: npm run pack:smoke

  hosted-os-deferred:
    if: github.event_name == 'pull_request'
    name: CI / Node 24 / ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_JSON) }}
    steps:
      - run: echo 'Full macOS and Windows tests run on pushes to main and weekly; this PR compatibility check preserves the required status name.'
